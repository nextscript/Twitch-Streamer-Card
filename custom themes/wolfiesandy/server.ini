[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
MiddleMouseUpAction=[!Refresh]
; Read the theme list (all *.inc files in @Resources\Themes)
OnRefreshAction=[!CommandMeasure MeasureThemeList "Run"]

[Metadata]
Name=Twitch Card
Information=Modern Twitch stream card with preview, status, viewers and uptime. Middle click = reload.

; ============================================================
;  VARIABLES
; ============================================================
[Variables]
Scale=1
Streamer=wolfiesandy
line1=37
line2=43
line3=39
TileValueY1=20
TileValueY2=20
TileValueY3=20
TileValueX1=8
TileValueX2=-15
TileValueX3=0
PreviewPanelExtraH=10
PreviewPanelExtraW=0
PreviewPanelExtraX=0
PreviewPanelExtraY=-8

; --- Layout -------------------------------------------------
CardW=(280*#Scale#)
Radius=(#CardRadius#*#Scale#)
Pad=(14*#Scale#)
Gap=(8*#Scale#)

PrevY=(58*#Scale#)
PrevW=(#CardW#-2*#Pad#)
PrevH=(#PrevW#*9/16)
PrevR=(#PreviewRadius#*#Scale#)

TileY=(#PrevY#+#PrevH#+12*#Scale#)
TileW=((#CardW#-2*#Pad#-2*#Gap#)/3)
TileH=(50*#Scale#)
TileR=(#TileRadius#*#Scale#)

CardH=(#TileY#+#TileH#+#Pad#)

; ============================================================
;  THEME DEFAULT VALUES
;  Every line here can be overridden in @Resources\Themes\<No>.inc
;  (similar to CSS properties). Anything a theme does not set
;  uses this default. See @Resources\Themes\THEMES.md.
;  Sizes/spacing are unscaled (they are multiplied by #Scale#).
; ============================================================
; Themes are stored once, centrally, in the skin group's @Resources folder
ThemesPath=#@#Themes\
; Theme images: @Resources\Themes\Images\<No>.png (background), <No>_avatar.png …
ImagesPath=#ThemesPath#Images\

; --- Card ---------------------------------------------------
CardRadius=18
BorderWidth=1
ColorBorder=255,255,255,22
AccentBarHeight=2

; --- General text -------------------------------------------
ColorText=245,245,250,255
ColorDim=245,245,250,120

; --- Header -------------------------------------------------
HeaderIndent=50
HeaderIndentY=0
TitleSize=14
SubtitleSize=8
ColorTitle=#ColorText#
ColorTitle2=#ColorTitle#
ColorSubtitle=#ColorDim#
TitleEffect=None
ColorTitleEffect=0,0,0,160
ColorIcon=#ColorDim#
ColorIconHover=#ColorAccent#

; Avatar (instead of the status dot, as soon as ImgAvatar is set)
AvatarSize=22
AvatarX=-4
AvatarRingWidth=1.5
ColorAvatarRing=#ColorAccent#

; --- Preview ------------------------------------------------
PreviewRadius=12
PreviewBorderWidth=1
ColorPreviewBorder=255,255,255,26
ColorPreviewBg=0,0,0,90
ColorPreviewShade=0,0,0,170
ColorHoverOverlay=0,0,0,110
HidePreviewViewers=0

ColorLive=235,4,0,255
ColorOffline=120,120,130,255
ColorStatus=120,120,130,255
ColorLiveBadge=#ColorLive#
ColorLiveBadgeText=255,255,255,255

; Offline display in the preview (text and/or image)
OfflineText=Offline
OfflineTextSize=16
ColorOfflineText=#ColorDim#
OfflineTextEffect=None
ColorOfflineTextEffect=0,0,0,160

; --- Tiles --------------------------------------------------
TileRadius=10
TileBorderWidth=1
ColorTile=255,255,255,10
ColorTileBorder=255,255,255,14
LabelSize=7
ColorLabel=#ColorDim#
ColorLabelIcon=#ColorAccent#
ValueSize=11
ColorValue=#ColorText#
ColorValue2=#ColorValue#
ValueEffect=None
ColorValueEffect=0,0,0,160
; offset of the value in tile 1/2/3 (e.g. to make room for an image)
TileValueShift1=0
TileValueShift2=0
TileValueShift3=0

; --- Fonts --------------------------------------------------
FontTitle=Segoe UI Semibold
FontText=Segoe UI
FontBold=Segoe UI Bold
FontIcon=Segoe MDL2 Assets
FontLabel=#FontTitle#
FontValue=#FontTitle#
FontOffline=#FontTitle#

; --- Image layers (empty = off) -----------------------------
; ImgCardBack   : behind everything, card size, rounded at the corners
; ImgCardFront  : above everything, card size (decoration, flowers …)
; ImgPreviewFrame: above the preview (frame/ornaments)
; ImgOffline    : fills the preview when the stream is offline
; ImgAvatar     : round avatar in the header
; ImgTile1..3   : image in tile 1/2/3 (position relative to the tile)
ImgCardBack=
ImgCardFront=
ImgPreviewFrame=
ImgOffline=
ImgAvatar=
ImgTile1=
ImgTile2=
ImgTile3=
TileImg1X=0
TileImg1Y=0
TileImg1W=40
TileImg1H=40
TileImg2X=0
TileImg2Y=0
TileImg2W=40
TileImg2H=40
TileImg3X=0
TileImg3Y=0
TileImg3W=40
TileImg3H=40

; --- Color scheme -------------------------------------------
; Theme = file name in @Resources\Themes without ".inc" (number or any name).
; New theme: just put a new .inc file into the folder - it is detected automatically.
; Must come AFTER the default values so the theme can override them.
Theme=wolfiesandy
; Fallback name if the theme does not set ThemeName
ThemeName=#Theme#
; Filled in by ThemeList.lua (next / previous theme, position in the list)
ThemeNext=#Theme#
ThemePrev=#Theme#
ThemeIndex=?
ThemeCount=?
@IncludeTheme=#ThemesPath##Theme#.inc

; ============================================================
;  MEASURES
; ============================================================
[MeasureSoftReload]
Measure=Calc
Formula=(MeasureSoftReload+1) % 300
IfCondition=(MeasureSoftReload=0)
IfTrueAction=[!UpdateMeasure *][!UpdateMeter *][!Redraw]
UpdateDivider=1

[MeasureSite]
Measure=Plugin
Plugin=WebParser
URL=https://tsapi.ts3x.cc/twitch.php?TS&name=#Streamer#&l1=#line1#&l2=#line2#&l3=#line3#
RegExp=(?siU)<span>(.*)</span><span>(.*)</span><span>(.*)</span><span>(.*)</span>
UpdateRate=60

[MeasureStreamerText]
Measure=Plugin
Plugin=WebParser
URL=[MeasureSite]
StringIndex=1
UpdateRate=60

[MeasureViewerText]
Measure=Plugin
Plugin=WebParser
URL=[MeasureSite]
StringIndex=2
UpdateRate=60

[MeasureStatusText]
Measure=Plugin
Plugin=WebParser
URL=[MeasureSite]
StringIndex=3
UpdateRate=60
; Offline / empty -> gray + offline layer, otherwise -> red + LIVE badge + preview
IfMatch=(?i)^\s*(offline|off|0)?\s*$
IfMatchAction=[!SetVariable ColorStatus "#ColorOffline#"][!HideMeterGroup LiveBadge][!HideMeterGroup Online][!HideMeter MeterPreviewViewers][!ShowMeterGroup Offline][!UpdateMeterGroup Status][!Redraw]
IfNotMatchAction=[!SetVariable ColorStatus "#ColorLive#"][!ShowMeterGroup LiveBadge][!ShowMeterGroup Online][!HideMeterGroup Offline][!SetOption MeterPreviewViewers Hidden "#HidePreviewViewers#"][!UpdateMeter MeterPreviewViewers][!UpdateMeterGroup Status][!Redraw]

[MeasureTimeText]
Measure=Plugin
Plugin=WebParser
URL=[MeasureSite]
StringIndex=4
UpdateRate=60

; Automatically detect all themes (*.inc in @Resources\Themes, any file name)
; RunCommand lists the folder hidden in the background, ThemeList.lua sorts it
; and sets ThemeNext / ThemePrev / ThemeIndex / ThemeCount.
[MeasureThemeList]
Measure=Plugin
Plugin=RunCommand
Program=cmd
Parameter=/u /c dir /b /a-d "*.inc"
StartInFolder=#ThemesPath#
OutputType=UTF16
FinishAction=[!CommandMeasure MeasureThemes "Parse()"]

[MeasureThemes]
Measure=Script
ScriptFile=#@#ThemeList.lua
ListMeasure=MeasureThemeList
UpdateDivider=-1

; Show the avatar as soon as the theme sets ImgAvatar, otherwise the status dot
[MeasureHasAvatar]
Measure=String
String=#ImgAvatar#
IfMatch=^\s*$
IfMatchAction=[!HideMeterGroup Avatar][!ShowMeterGroup StatusDot][!Redraw]
IfNotMatchAction=[!ShowMeterGroup Avatar][!HideMeterGroup StatusDot][!Redraw]
UpdateDivider=-1

; Input field for changing the streamer (opened via MeterEditButton)
[MeasureStreamerInput]
Measure=Plugin
Plugin=InputText
X=(#Pad#+#HeaderIndent#*#Scale#)
Y=((14+#HeaderIndentY#)*#Scale#)
W=(#CardW#-#Pad#-#HeaderIndent#*#Scale#-92*#Scale#)
H=(24*#Scale#)
SolidColor=28,28,34
FontColor=245,245,250
FontFace=#FontTitle#
FontSize=(11*#Scale#)
StringStyle=Bold
FocusDismiss=1
DefaultValue=#Streamer#
DynamicVariables=1
Command1=[!WriteKeyValue Variables Streamer "$UserInput$"][!Refresh]

[MeasureImageDownload]
Measure=Plugin
Plugin=WebParser
URL=https://static-cdn.jtvnw.net/previews-ttv/live_user_#Streamer#-440x248.jpg
Download=1
DownloadFile=current.jpg
; Bypass the cache so a fresh image is always loaded
ForceReload=1
UpdateRate=60
FinishAction=[!UpdateMeter MeterPreview][!Redraw]

; ============================================================
;  CARD
; ============================================================
; Mask for rounded corners (container, not drawn itself)
[MeterCardMask]
Meter=Shape
Shape=Rectangle 0,0,#CardW#,#CardH#,#Radius# | Fill Color 255,255,255,255 | StrokeWidth 0
DynamicVariables=1

[MeterCard]
Meter=Shape
Container=MeterCardMask
Shape=Rectangle 0,0,#CardW#,#CardH# | Fill LinearGradient BgGrad | StrokeWidth 0
BgGrad=90 | #ColorBgTop# ; 0.0 | #ColorBgBottom# ; 1.0
DynamicVariables=1

[MeterCardBackImage]
Meter=Image
Container=MeterCardMask
ImageName=#ImgCardBack#
X=0
Y=0
W=#CardW#
H=#CardH#
DynamicVariables=1

[MeterCardBorder]
Meter=Shape
Shape=Rectangle 0,0,#CardW#,#CardH#,#Radius# | Fill Color 0,0,0,0 | StrokeWidth #BorderWidth# | Stroke Color #ColorBorder#
; subtle accent glow at the top
Shape2=Rectangle (#Radius#),0,(#CardW#-2*#Radius#),(#AccentBarHeight#*#Scale#),(1*#Scale#) | Fill LinearGradient AccentGrad | StrokeWidth 0
AccentGrad=0 | #ColorAccent# ; 0.0 | #ColorAccent2# ; 1.0
DynamicVariables=1

; ============================================================
;  HEADER
; ============================================================
[MeterStatusDot]
Meter=Shape
Group=Status | StatusDot
Shape=Ellipse (#Pad#+6*#Scale#),(30*#Scale#),(5*#Scale#) | Fill Color #ColorStatus# | StrokeWidth 0
Shape2=Ellipse (#Pad#+6*#Scale#),(30*#Scale#),(8*#Scale#) | Fill Color 0,0,0,0 | StrokeWidth (1.5*#Scale#) | Stroke Color #ColorStatus#
DynamicVariables=1

[MeterAvatarMask]
Meter=Shape
Group=Avatar
Hidden=1
X=(#Pad#+#AvatarX#*#Scale#)
Y=(30*#Scale#-#AvatarSize#*#Scale#/2)
Shape=Ellipse (#AvatarSize#*#Scale#/2),(#AvatarSize#*#Scale#/2),(#AvatarSize#*#Scale#/2) | Fill Color 255,255,255,255 | StrokeWidth 0
DynamicVariables=1

[MeterAvatar]
Meter=Image
Container=MeterAvatarMask
Group=Avatar
Hidden=1
ImageName=#ImgAvatar#
X=0
Y=0
W=(#AvatarSize#*#Scale#)
H=(#AvatarSize#*#Scale#)
PreserveAspectRatio=0
DynamicVariables=1

[MeterAvatarRing]
Meter=Shape
Group=Avatar | Status
Hidden=1
X=(#Pad#+#AvatarX#*#Scale#)
Y=(30*#Scale#-#AvatarSize#*#Scale#/2)
Shape=Ellipse (#AvatarSize#*#Scale#/2),(#AvatarSize#*#Scale#/2),(#AvatarSize#*#Scale#/2) | Fill Color 0,0,0,0 | StrokeWidth (#AvatarRingWidth#*#Scale#) | Stroke Color #ColorAvatarRing#
; small status dot at the bottom right of the avatar
Shape2=Ellipse (#AvatarSize#*#Scale#*0.85),(#AvatarSize#*#Scale#*0.85),(3.5*#Scale#) | Fill Color #ColorStatus# | StrokeWidth (1.5*#Scale#) | Stroke Color #ColorBgTop#
DynamicVariables=1

[MeterTitle]
Meter=String
Text=#Streamer#
X=(#Pad#+#HeaderIndent#*#Scale#)
Y=((13+#HeaderIndentY#)*#Scale#)
FontFace=#FontTitle#
FontSize=(#TitleSize#*#Scale#)
FontColor=#ColorTitle#
InlineSetting=GradientColor | 90 | #ColorTitle# ; 0.0 | #ColorTitle2# ; 1.0
InlinePattern=.*
StringEffect=#TitleEffect#
FontEffectColor=#ColorTitleEffect#
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=["https://twitch.tv/#Streamer#"]

[MeterSubtitle]
Meter=String
Text=twitch.tv/#Streamer#
X=(#Pad#+#HeaderIndent#*#Scale#)
Y=((38+#HeaderIndentY#)*#Scale#)
FontFace=#FontText#
FontSize=(#SubtitleSize#*#Scale#)
FontColor=#ColorSubtitle#
AntiAlias=1
DynamicVariables=1

[StyleHeaderButton]
Y=(20*#Scale#)
FontFace=#FontIcon#
FontSize=(11*#Scale#)
FontColor=#ColorIcon#
StringAlign=Right
AntiAlias=1
DynamicVariables=1
MouseOverAction=[!SetOption #CURRENTSECTION# FontColor "#ColorIconHover#"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# FontColor "#ColorIcon#"][!UpdateMeter #CURRENTSECTION#][!Redraw]

[MeterReloadButton]
Meter=String
MeterStyle=StyleHeaderButton
Text=[\xE72C]
X=(#CardW#-#Pad#)
ToolTipText=Refresh skin
LeftMouseUpAction=[!Refresh]

[MeterThemeButton]
Meter=String
MeterStyle=StyleHeaderButton
Text=[\xE790]
X=(#CardW#-#Pad#-24*#Scale#)
ToolTipText=Color scheme: #ThemeName# (#ThemeIndex#/#ThemeCount#)#CRLF#Click / mouse wheel = switch
LeftMouseUpAction=[!WriteKeyValue Variables Theme "#ThemeNext#"][!Refresh]
MouseScrollDownAction=[!WriteKeyValue Variables Theme "#ThemeNext#"][!Refresh]
MouseScrollUpAction=[!WriteKeyValue Variables Theme "#ThemePrev#"][!Refresh]

[MeterEditButton]
Meter=String
MeterStyle=StyleHeaderButton
Text=[\xE70F]
X=(#CardW#-#Pad#-48*#Scale#)
ToolTipText=Change streamer (current: #Streamer#)#CRLF#Enter = save, Esc = cancel
LeftMouseUpAction=[!CommandMeasure MeasureStreamerInput "ExecuteBatch 1"]

; ============================================================
;  PREVIEW (rounded via container)
; ============================================================
[MeterPreviewMask]
Meter=Shape
X=(#Pad#+#PreviewPanelExtraX#*#Scale#)
Y=(#PrevY#+#PreviewPanelExtraY#*#Scale#)
Shape=Rectangle 0,0,(#PrevW#+#PreviewPanelExtraW#*#Scale#),(#PrevH#+#PreviewPanelExtraH#*#Scale#),#PrevR# | Fill Color 255,255,255,255 | StrokeWidth 0
DynamicVariables=1

[MeterPreviewPlaceholder]
Meter=Shape
Container=MeterPreviewMask
Shape=Rectangle 0,0,(#PrevW#+#PreviewPanelExtraW#*#Scale#),(#PrevH#+#PreviewPanelExtraH#*#Scale#) | Fill Color #ColorPreviewBg# | StrokeWidth 0
DynamicVariables=1

[MeterPreview]
Meter=Image
Container=MeterPreviewMask
Group=Online
MeasureName=MeasureImageDownload
X=0
Y=0
W=(#PrevW#+#PreviewPanelExtraW#*#Scale#)
H=(#PrevH#+#PreviewPanelExtraH#*#Scale#)
PreserveAspectRatio=0
DynamicVariables=1

[MeterPreviewShade]
Meter=Shape
Container=MeterPreviewMask
Group=Online
Hidden=1
DynamicVariables=1

; --- Offline layer ------------------------------------------
[MeterOfflineImage]
Meter=Image
Container=MeterPreviewMask
Group=Offline
Hidden=1
ImageName=#ImgOffline#
X=0
Y=0
W=(#PrevW#+#PreviewPanelExtraW#*#Scale#)
H=(#PrevH#+#PreviewPanelExtraH#*#Scale#)
PreserveAspectRatio=0
DynamicVariables=1

[MeterOfflineText]
Meter=String
Container=MeterPreviewMask
Group=Offline
Hidden=1
Text=#OfflineText#
X=((#PrevW#+#PreviewPanelExtraW#*#Scale#)/2)
Y=((#PrevH#+#PreviewPanelExtraH#*#Scale#)/2)
FontFace=#FontOffline#
FontSize=(#OfflineTextSize#*#Scale#)
FontColor=#ColorOfflineText#
StringAlign=CenterCenter
StringEffect=#OfflineTextEffect#
FontEffectColor=#ColorOfflineTextEffect#
AntiAlias=1
DynamicVariables=1

[MeterPreviewFrame]
Meter=Image
Container=MeterPreviewMask
ImageName=#ImgPreviewFrame#
X=0
Y=0
W=(#PrevW#+#PreviewPanelExtraW#*#Scale#)
H=(#PrevH#+#PreviewPanelExtraH#*#Scale#)
DynamicVariables=1

[MeterHoverOverlay]
Meter=Shape
Container=MeterPreviewMask
Group=Hover
Hidden=1
Shape=Rectangle 0,0,(#PrevW#+#PreviewPanelExtraW#*#Scale#),(#PrevH#+#PreviewPanelExtraH#*#Scale#) | Fill Color #ColorHoverOverlay# | StrokeWidth 0
Shape2=Ellipse ((#PrevW#+#PreviewPanelExtraW#*#Scale#)/2),((#PrevH#+#PreviewPanelExtraH#*#Scale#)/2),(22*#Scale#) | Fill Color #ColorAccent# | StrokeWidth 0
DynamicVariables=1

[MeterHoverIcon]
Meter=String
Container=MeterPreviewMask
Group=Hover
Hidden=1
Text=[\xE768]
X=((#PrevW#+#PreviewPanelExtraW#*#Scale#)/2+2*#Scale#)
Y=((#PrevH#+#PreviewPanelExtraH#*#Scale#)/2)
FontFace=#FontIcon#
FontSize=(14*#Scale#)
FontColor=255,255,255,255
StringAlign=CenterCenter
AntiAlias=1
DynamicVariables=1

; LIVE badge at the top left
[MeterLiveBadge]
Meter=Shape
Container=MeterPreviewMask
Group=LiveBadge | Status
Hidden=1
Shape=Rectangle (8*#Scale#),(8*#Scale#),(40*#Scale#),(17*#Scale#),(4*#Scale#) | Fill Color #ColorLiveBadge# | StrokeWidth 0
DynamicVariables=1

[MeterLiveBadgeText]
Meter=String
Container=MeterPreviewMask
Group=LiveBadge
Hidden=1
Text=LIVE
X=(28*#Scale#)
Y=(16.5*#Scale#)
FontFace=#FontBold#
FontSize=(7.5*#Scale#)
FontColor=#ColorLiveBadgeText#
StringAlign=CenterCenter
CharacterSpacing=1
AntiAlias=1
DynamicVariables=1

; viewer overlay at the bottom left
[MeterPreviewViewers]
Meter=String
Container=MeterPreviewMask
MeasureName=MeasureViewerText
Text=[\xE890]  %1
X=(10*#Scale#)
Y=((#PrevH#+#PreviewPanelExtraH#*#Scale#)-8*#Scale#)
FontFace=#FontTitle#
FontSize=(8.5*#Scale#)
FontColor=255,255,255,230
StringAlign=LeftBottom
InlineSetting=Face | #FontIcon#
InlinePattern=^.
InlineSetting2=Size | (7.5*#Scale#)
InlinePattern2=^.
AntiAlias=1
DynamicVariables=1

; Hitbox for hover + click (topmost layer)
[MeterPreviewHitbox]
Meter=Shape
X=(#Pad#+#PreviewPanelExtraX#*#Scale#)
Y=(#PrevY#+#PreviewPanelExtraY#*#Scale#)
Shape=Rectangle 0,0,(#PrevW#+#PreviewPanelExtraW#*#Scale#),(#PrevH#+#PreviewPanelExtraH#*#Scale#),#PrevR# | Fill Color 0,0,0,1 | StrokeWidth #PreviewBorderWidth# | Stroke Color #ColorPreviewBorder#
DynamicVariables=1
MouseOverAction=[!ShowMeterGroup Hover][!Redraw]
MouseLeaveAction=[!HideMeterGroup Hover][!Redraw]
LeftMouseUpAction=["https://twitch.tv/#Streamer#"]

; ============================================================
;  STAT TILES
; ============================================================
[MeterTiles]
Meter=Shape
Shape=Rectangle #Pad#,#TileY#,#TileW#,#TileH#,#TileR# | Fill Color #ColorTile# | StrokeWidth #TileBorderWidth# | Stroke Color #ColorTileBorder#
Shape2=Rectangle (#Pad#+#TileW#+#Gap#),#TileY#,#TileW#,#TileH#,#TileR# | Fill Color #ColorTile# | StrokeWidth #TileBorderWidth# | Stroke Color #ColorTileBorder#
Shape3=Rectangle (#Pad#+2*(#TileW#+#Gap#)),#TileY#,#TileW#,#TileH#,#TileR# | Fill Color #ColorTile# | StrokeWidth #TileBorderWidth# | Stroke Color #ColorTileBorder#
DynamicVariables=1

[StyleTileLabel]
Y=(#TileY#+9*#Scale#)
FontFace=#FontLabel#
FontSize=(#LabelSize#*#Scale#)
FontColor=#ColorLabel#
StringAlign=Center
CharacterSpacing=1
InlineSetting=Face | #FontIcon#
InlinePattern=^.
InlineSetting2=Color | #ColorLabelIcon#
InlinePattern2=^.
AntiAlias=1
DynamicVariables=1

[StyleTileImage]
PreserveAspectRatio=1
DynamicVariables=1

[StyleTileValue]
Y=(#TileY#+23*#Scale#)
W=(#TileW#-8*#Scale#)
H=(20*#Scale#)
FontFace=#FontValue#
FontSize=(#ValueSize#*#Scale#)
FontColor=#ColorValue#
InlineSetting=GradientColor | 90 | #ColorValue# ; 0.0 | #ColorValue2# ; 1.0
InlinePattern=.*
StringEffect=#ValueEffect#
FontEffectColor=#ColorValueEffect#
StringAlign=Center
ClipString=1
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=["https://twitch.tv/#Streamer#"]

; --- Status -------------------------------------------------
[MeterStatusLabel]
Meter=String
MeterStyle=StyleTileLabel
Text=[\xE7F4]  STATUS
X=(#Pad#+#TileW#/2)

[MeterTile1Image]
Meter=Image
MeterStyle=StyleTileImage
ImageName=#ImgTile1#
X=(#Pad#+#TileImg1X#*#Scale#)
Y=(#TileY#+#TileImg1Y#*#Scale#)
W=(#TileImg1W#*#Scale#)
H=(#TileImg1H#*#Scale#)

[MeterStatusValue]
Meter=String
MeterStyle=StyleTileValue
Group=Status
MeasureName=MeasureStatusText
Text=%1
X=(#Pad#+#TileW#/2+(#TileValueShift1#+#TileValueX1#)*#Scale#)
Y=(#TileY#+#TileValueY1#*#Scale#)
FontColor=#ColorStatus#
InlineSetting=Color | #ColorStatus#

; --- Viewers ------------------------------------------------
[MeterViewerLabel]
Meter=String
MeterStyle=StyleTileLabel
Text=[\xE716]  VIEWERS
X=(#Pad#+#TileW#*1.5+#Gap#)

[MeterTile2Image]
Meter=Image
MeterStyle=StyleTileImage
ImageName=#ImgTile2#
X=(#Pad#+#TileW#+#Gap#+#TileImg2X#*#Scale#)
Y=(#TileY#+#TileImg2Y#*#Scale#)
W=(#TileImg2W#*#Scale#)
H=(#TileImg2H#*#Scale#)

[MeterViewerValue]
Meter=String
MeterStyle=StyleTileValue
MeasureName=MeasureViewerText
Text=%1
X=(#Pad#+#TileW#*1.5+#Gap#+(#TileValueShift2#+#TileValueX2#)*#Scale#)
Y=(#TileY#+#TileValueY2#*#Scale#)

; --- Uptime -------------------------------------------------
[MeterTimeLabel]
Meter=String
MeterStyle=StyleTileLabel
Text=[\xE823]  UPTIME
X=(#Pad#+#TileW#*2.5+2*#Gap#)

[MeterTile3Image]
Meter=Image
MeterStyle=StyleTileImage
ImageName=#ImgTile3#
X=(#Pad#+2*(#TileW#+#Gap#)+#TileImg3X#*#Scale#)
Y=(#TileY#+#TileImg3Y#*#Scale#)
W=(#TileImg3W#*#Scale#)
H=(#TileImg3H#*#Scale#)

[MeterTimeValue]
Meter=String
MeterStyle=StyleTileValue
MeasureName=MeasureTimeText
Text=%1
X=(#Pad#+#TileW#*2.5+2*#Gap#+(#TileValueShift3#+#TileValueX3#)*#Scale#)
Y=(#TileY#+#TileValueY3#*#Scale#)

; ============================================================
;  FRONTMOST DECORATION LAYER (does not capture mouse clicks)
; ============================================================
[MeterCardFrontImage]
Meter=Image
ImageName=#ImgCardFront#
X=0
Y=0
W=#CardW#
H=#CardH#
DynamicVariables=1
